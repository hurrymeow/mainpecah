<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Split</title>
<style>
/* Layout: one locked portrait column. Header, controls, square board filling the rest, actions. */
:root {
  --bg: #0d0f14;
  --panel: #161a22;
  --well: #1e232d;
  --line: #2a303c;
  --text: #e9ecf3;
  --muted: #8a92a6;
  --accent: #8fb3ff;
  --bad: #ff4757;
  --good: #4fd69c;
  --dot: rgba(233,236,243,.13);
  --ol: #2b1d16;      /* cartoon outline */
  --warn: #ffc04d;
  --gap: 6px;
  --cell: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--text);
  font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
body { position: fixed; inset: 0; }
#app {
  height: 100%; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-block: max(10px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: .06em; }
.stats { display: flex; gap: 14px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--text); font-weight: 650; }

.controls { display: flex; gap: 10px; align-items: center; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
.seg button { border: 0; background: none; color: var(--muted); padding: 8px 11px; font: inherit; font-size: 14px; }
.seg button.on { background: var(--line); color: var(--text); }
.slider { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.slider input { flex: 1; min-width: 0; accent-color: var(--accent); }
.slider output { color: var(--text); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }

#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#board {
  display: grid; gap: var(--gap); padding: var(--gap);
  background: var(--panel); border-radius: 14px; touch-action: none;
}
.cell { position: relative; border-radius: 10px; background: var(--well); }
.cell.hint-dst { box-shadow: inset 0 0 0 3px var(--accent); }
.tile {
  position: absolute; inset: 0; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: calc(var(--cell) * .42); color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,.45); font-variant-numeric: tabular-nums;
  transition: transform .08s ease-out;
}
.tile.active { transform: scale(.94); }
.tile.ghost { opacity: .5; outline: 2px dashed rgba(255,255,255,.75); outline-offset: -5px; }
.dot {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: calc(var(--cell) * .24); color: var(--dot);
}
.tile.done { filter: saturate(.45) brightness(.88); }
.tile.slide { animation: slide .14s ease-out; }
.tile.pop { animation: pop .2s ease-out; }
.tile.flash { animation: flash .55s ease-out; }
@keyframes slide {
  from { transform: translate(calc(var(--sx) * (var(--cell) + var(--gap))), calc(var(--sy) * (var(--cell) + var(--gap)))) scale(.9); }
}
@keyframes pop { 0% { transform: scale(.86); } 60% { transform: scale(1.07); } }
@keyframes flash {
  0% { filter: brightness(1.9) saturate(1); transform: scale(1.1); }
  100% { filter: saturate(.45) brightness(.88); transform: none; }
}
/* Slime skin: the tile square goes transparent and holds a blob sized by value. */
.tile { background: var(--col); }
.tile.slime { background: none; text-shadow: none; }
.blob {
  --w: calc(var(--cell) * var(--s));
  position: absolute; bottom: 7%; left: calc((var(--cell) - var(--w)) / 2);
  width: var(--w); height: calc(var(--w) * .88);
  border-radius: 50% 50% 44% 44% / 60% 60% 40% 40%;
  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.5) 0 7%, transparent 8%), var(--col);
  box-shadow: inset 0 calc(var(--w) * -.09) 0 rgba(0,0,0,.2);
  transform-origin: 50% 100%; transition: transform .12s ease-out;
}
.fx .blob { animation: breathe 2.6s ease-in-out var(--d) infinite; }
@keyframes breathe { 50% { transform: scale(1.05, .95); } }
/* Animation phases come from a shared clock (set per render), so re-renders don't make slimes jump. */
.fx .slime:not(.sleep) .eye { animation: blink var(--bp) linear var(--bd) infinite; }
@keyframes blink { 0%, 93%, 100% { transform: none; } 96% { transform: scaleY(.1); } }
.z {
  position: absolute; left: 60%; top: 36%; opacity: 0; pointer-events: none;
  font-size: calc(var(--cell) * .15); font-weight: 800; color: rgba(233,236,243,.6);
}
.kitten .z { left: 30%; top: 4%; color: #9ad4e0; }
.fx .z { animation: zzz 3.2s ease-out var(--d) infinite; }
@keyframes zzz {
  0% { opacity: 0; transform: translate(0, 0) scale(.6); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translate(60%, -160%) scale(1.15); }
}
/* Split: the parent wobbles like jelly, the baby hops over in an arc and lands with a squash. */
.tile.slime.pop, .tile.slime.slide { animation: none; }
.fx .slime.pop .blob { animation: wobble .45s ease-out, breathe 2.6s ease-in-out .45s infinite; }
.fx .tile.slime.slide { animation: hop .28s ease-out; }
.fx .slime.slide .blob { animation: land .42s ease-out; }
@keyframes hop {
  0% { transform: translate(calc(var(--sx) * (var(--cell) + var(--gap))), calc(var(--sy) * (var(--cell) + var(--gap)))); }
  50% { transform: translate(calc(var(--sx) * .5 * (var(--cell) + var(--gap))), calc(var(--sy) * .5 * (var(--cell) + var(--gap)) - var(--cell) * .3)); }
  100% { transform: none; }
}
@keyframes land {
  0%, 62% { transform: scale(.84, 1.16); }
  80% { transform: scale(1.26, .74); }
  100% { transform: none; }
}
@keyframes wobble {
  0% { transform: scale(1.26, .76); }
  30% { transform: scale(.86, 1.14); }
  55% { transform: scale(1.07, .95); }
  78% { transform: scale(.98, 1.02); }
  100% { transform: none; }
}
/* Region done: its slimes jump in a wave. Win: the whole board does. */
.fx .slime.flash .blob, .fx .slime.cheer .blob { animation: jump .5s ease-out var(--wd) both; }
@keyframes jump {
  0%, 100% { transform: none; }
  25% { transform: scale(1.16, .82); }
  50% { transform: translateY(-40%) scale(.9, 1.12); }
  80% { transform: scale(1.12, .88); }
}
.eye {
  position: absolute; top: 32%; width: 19%; height: 26%;
  background: #fff; border-radius: 50%;
}
.eye + .eye { left: auto; right: 22%; }
.eye:first-child { left: 22%; }
.eye::after {
  content: ""; position: absolute; left: 25%; top: 34%; width: 55%; height: 55%;
  background: #141720; border-radius: 50%; transition: left .1s, top .1s;
}
.blob::after {
  content: ""; position: absolute; left: 40%; top: 60%; width: 20%; height: 10%;
  border-bottom: max(2px, calc(var(--w) * .045)) solid rgba(10,12,18,.6); border-radius: 0 0 50% 50%;
}
.sleep .eye { top: 46%; height: 5%; background: rgba(10,12,18,.65); border-radius: 3px; }
.sleep .eye::after { display: none; }
.sleep .blob::after { width: 10%; left: 45%; height: 6%; top: 64%; }
.upset .blob { animation: none; transform: scale(1.12, .8); }
.fx .upset .blob { animation: tremble .32s linear infinite; }
@keyframes tremble {
  0%, 50%, 100% { transform: scale(1.12, .8); }
  25% { transform: translateX(-3%) scale(1.12, .8); }
  75% { transform: translateX(3%) scale(1.12, .8); }
}
.upset .eye { height: 13%; top: 38%; }
.upset .blob::after { border-bottom: 0; border-top: max(2px, calc(var(--w) * .045)) solid rgba(10,12,18,.6); border-radius: 50% 50% 0 0; top: 66%; }
.stretch-right .blob { animation: none; transform-origin: 0 100%; transform: scale(1.22, .88); }
.stretch-left .blob { animation: none; transform-origin: 100% 100%; transform: scale(1.22, .88); }
.stretch-up .blob { animation: none; transform: scale(.88, 1.24); }
.stretch-down .blob { animation: none; transform: scale(1.14, .82); }
.stretch-right .blob, .stretch-left .blob { --ax: 1.22; --ay: .88; }
.stretch-up .blob { --ax: .88; --ay: 1.24; }
.stretch-down .blob { --ax: 1.14; --ay: .82; }
.fx [class*="stretch-"] .blob { animation: stretch .24s cubic-bezier(.34, 1.8, .6, 1) both; }
@keyframes stretch { from { transform: none; } to { transform: scale(var(--ax), var(--ay)); } }
.stretch-right .eye::after { left: 45%; }
.stretch-left .eye::after { left: 5%; }
.stretch-up .eye::after { top: 8%; }
.stretch-down .eye::after { top: 45%; }
.badge {
  position: absolute; right: 4%; top: 4%; padding: 0 .3em; border-radius: 6px;
  font-size: calc(var(--cell) * .18); line-height: 1.35; color: #fff; background: rgba(0,0,0,.45);
}
.slime.blocked { box-shadow: none; }
.slime.blocked .blob { box-shadow: 0 0 0 3px var(--bad), 0 0 14px rgba(255,71,87,.6); }
/* Kitten skin: reuses the slime sprite slot (.blob) but draws an SVG instead.
   A cell with several kittens is a fight cloud; one kitten curls up asleep. */
.blob.kit {
  height: var(--w); bottom: 4%; background: none; box-shadow: none; border-radius: 0;
}
.blob.kit::after { display: none; }
.kit svg { width: 100%; height: 100%; display: block; overflow: visible; }
.tile { pointer-events: none; } /* touches hit the cell underneath, even mid-hop */
.kit .fur { fill: var(--col); }
.kit .tail { fill: none; stroke: var(--col); stroke-width: 7; stroke-linecap: round; }
.kit .tailo { fill: none; stroke: var(--ol); stroke-width: 12; stroke-linecap: round; }
.kit .tails { fill: none; stroke: var(--col2); stroke-width: 7; stroke-dasharray: 3 6; }
.kit .ol { stroke: var(--ol); stroke-width: 3; stroke-linejoin: round; }
.kit .stripe { fill: none; stroke: var(--col2); stroke-width: 3.5; stroke-linecap: round; }
.kit .white { fill: #fff7ec; }
.kit .blush { fill: #ff9db0; opacity: .5; }
.kit .cloudo { fill: var(--ol); }
.kit .cloud { fill: var(--cloud); }
.kit .thin { stroke-width: 2; }
.kit .ear { fill: #f4a6b8; }
.kit .ink { fill: none; stroke: var(--ol); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.kit .whisker { stroke: rgba(255,255,255,.6); stroke-width: 1.5; stroke-linecap: round; }
.kit .paw { fill: #f3efe8; }
.kit .zap { fill: #ffd84d; font: 800 22px system-ui, sans-serif; }
.bed {
  position: absolute; left: 20%; right: 20%; bottom: 16%; height: 26%;
  border: 2px dashed var(--dot); border-radius: 50%;
}
.fx .fight:not(.active) .kit { animation: scuffle var(--sh) linear var(--d) infinite; }
@keyframes scuffle {
  0%, 100% { transform: translate(0, 0) rotate(0); }
  20% { transform: translate(-3%, 1%) rotate(-4deg); }
  40% { transform: translate(3%, -2%) rotate(3deg); }
  60% { transform: translate(-2%, -1%) rotate(2deg); }
  80% { transform: translate(2%, 2%) rotate(-3deg); }
}
.fx .kit .zap { animation: zap .6s steps(1) var(--d) infinite; }
.fx .kit .zap + .zap { animation-delay: calc(var(--d) - .3s); }
@keyframes zap { 0% { opacity: 1; } 50% { opacity: 0; } }
.kitten.blocked .blob { box-shadow: none; filter: drop-shadow(0 0 2px var(--bad)) drop-shadow(0 0 5px var(--bad)); }
/* Split burst: dust puffs fly out of the cloud. */
.puff {
  position: absolute; left: 50%; top: 58%; width: 16%; height: 16%; border-radius: 50%;
  background: rgba(233,236,243,.75); opacity: 0; pointer-events: none;
}
.fx .puff { animation: puff .45s ease-out; }
@keyframes puff {
  0% { opacity: .9; transform: translate(-50%, -50%) rotate(var(--a)) translateY(0) scale(.6); }
  100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--a)) translateY(-280%) scale(1.4); }
}
/* Fuse: every fight burns down; at zero it explodes and the board is lost. */
.fuse {
  position: absolute; left: 16%; right: 16%; bottom: 3%; height: 5%; border-radius: 4px;
  background: var(--good); transform-origin: left center; pointer-events: none;
}
.live .fuse { animation: burn var(--ft) linear var(--fd) forwards; }
@keyframes burn {
  0% { transform: scaleX(1); background: var(--good); }
  60% { background: var(--warn); }
  85%, 100% { background: var(--bad); }
  100% { transform: scaleX(0); }
}
.danger .blob { filter: drop-shadow(0 0 3px var(--bad)) drop-shadow(0 0 6px var(--bad)); }
.tile.danger:not(.slime) { box-shadow: 0 0 0 3px var(--bad); }
.fx .danger:not(.active) .kit { animation-duration: .14s; }
.tile.boom { z-index: 2; }
.boom .blob { animation: boom .5s ease-out forwards !important; }
@keyframes boom { 40% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(2.1); opacity: 0; } }
.boom .puff { animation: blast .6s ease-out forwards; background: var(--warn); }
@keyframes blast {
  0% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--a)) translateY(0) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--a)) translateY(-520%) scale(1.8); }
}
.pow {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font: 900 calc(var(--cell) * .36) system-ui, sans-serif; color: var(--warn);
  -webkit-text-stroke: 2px var(--ol); animation: pow .6s ease-out both;
}
@keyframes pow { 0% { transform: scale(.3) rotate(-12deg); } 50% { transform: scale(1.3) rotate(6deg); } 100% { transform: scale(1.1) rotate(-4deg); } }
#board.shake { animation: shake .4s linear; }
@keyframes shake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, -2px); } 80% { transform: translate(3px, 3px); } }
.card h2.lose { color: var(--bad); }
.card p { margin: 0; color: var(--muted); }
.tile.blocked { box-shadow: inset 0 0 0 4px var(--bad), 0 0 14px rgba(255,71,87,.55); }
.tile .arrow {
  position: absolute; top: 3px; right: 6px; font-size: calc(var(--cell) * .26);
  color: var(--accent); text-shadow: 0 0 4px #000;
}

#status { height: 20px; text-align: center; font-size: 14px; color: var(--muted); }
#status.bad { color: var(--bad); font-weight: 700; }
#status.hint { color: var(--accent); }

.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
button.btn {
  font: inherit; font-weight: 650; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 13px 0;
}
button.btn:active { background: var(--line); }
button.btn:disabled { opacity: .4; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.debug { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
.debug label { display: flex; align-items: center; gap: 6px; }
.debug select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; }

#overlay {
  position: fixed; inset: 0; background: rgba(5,6,10,.72);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  padding: 24px; width: min(320px, 100%); text-align: center;
  display: flex; flex-direction: column; gap: 14px;
}
.card h2 { margin: 0; font-size: 30px; color: var(--good); letter-spacing: .04em; }
.card dl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 0; font-variant-numeric: tabular-nums; }
.card dt { color: var(--muted); text-align: right; }
.card dd { margin: 0; text-align: left; font-weight: 700; }
.card .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .tile, .tile.slide, .tile.pop, .tile.flash, .blob, .eye, .z, .zap, .puff { transition: none; animation: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>SPLIT</h1>
    <div class="stats">
      <span>Time <b id="time">0:00</b></span>
      <span>Undos <b id="undos">0</b></span>
      <span>Empty <b id="left">0</b></span>
    </div>
  </header>

  <div class="controls">
    <div class="seg" id="sizes">
      <button data-n="4">4×4</button><button data-n="5">5×5</button><button data-n="6">6×6</button>
    </div>
    <label class="slider">Tiles
      <input id="tiles" type="range" min="2" max="10" value="5">
      <output id="tilesOut">5</output>
    </label>
  </div>

  <div id="stage"><div id="board"></div></div>
  <div id="status"></div>

  <div class="actions">
    <button class="btn" id="undo">Undo</button>
    <button class="btn" id="restart">Restart</button>
    <button class="btn" id="new">New board</button>
  </div>
  <div class="debug">
    <label>Skin <select id="skin"><option value="kittens">Kittens</option><option value="slimes">Slimes</option><option value="numbers">Numbers</option></select></label>
    <label><input type="checkbox" id="effects" checked> Effects</label>
    <label>Fuse <select id="fuse"><option value="0">Off</option><option value="8">8s</option><option value="12" selected>12s</option><option value="20">20s</option></select></label>
    <label><input type="checkbox" id="showSol"> Show solution</label>
    <span id="info"></span>
  </div>
</div>

<div id="overlay" hidden>
  <div class="card">
    <h2 id="winTitle">Solved</h2>
    <p id="winMsg"></p>
    <dl><dt>Time</dt><dd id="winTime"></dd><dt>Undos</dt><dd id="winUndos"></dd></dl>
    <div class="row">
      <button class="btn" id="winRestart">Replay</button>
      <button class="btn" id="winNew">New board</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ===================== STATE =====================
// A board is a flat array of n*n cells. Each cell is null (empty) or {v, c}:
// v = value (power of two), c = colour id of the starting tile it descends from.

const MAX_TILE = 16;
const THRESHOLD = 20; // px before a drag counts as a swipe
const SIZES = { 4: { min: 2, max: 10, def: 5 }, 5: { min: 3, max: 15, def: 8 }, 6: { min: 4, max: 20, def: 11 } };
const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
const ARROWS = { up: '↑', down: '↓', left: '←', right: '→' };

const S = {
  n: 4, target: 5,
  board: null,      // generator output: {n, cells, solution, path}
  cells: null,      // current cells
  history: [],      // previous cells, for unlimited undo
  undos: 0,
  t0: 0, elapsed: 0, timer: 0,
  won: false,
  lost: false,
  fuseMs: 12000,    // fight timer length; 0 = off
  fuse: [],         // per cell: absolute deadline (ms) for a fight, else null
  showSol: false,
  effects: true,    // split motion, region pulse, sound
  skin: 'kittens',  // 'kittens' | 'slimes' | 'numbers'
  anim: null,       // one-shot animation for the next render: {from, to, dir, region}
  drag: null,       // {id, i, x, y, dir, dest}
};

const cloneCells = cells => cells.map(t => t && { v: t.v, c: t.c });
const keyOf = cells => cells.map(t => (t ? t.v : 0)).join(',');

// ===================== GENERATOR =====================
// Reverse merge: start all 1s, merge equal orthogonal neighbours until the
// tile count hits the target. Each merge is recorded; replaying them backwards
// as splits is a guaranteed solution.

function generate(n, target, rand = Math.random) {
  let best = null;
  for (let attempt = 0; attempt < 200; attempt++) {
    const v = new Array(n * n).fill(1);
    const merges = [];
    let tiles = n * n;
    while (tiles > target) {
      const pairs = [];
      for (let i = 0; i < n * n; i++) {
        if (!v[i] || v[i] * 2 > MAX_TILE) continue;
        if (i % n + 1 < n && v[i + 1] === v[i]) pairs.push([i, i + 1]);
        if (i + n < n * n && v[i + n] === v[i]) pairs.push([i, i + n]);
      }
      if (!pairs.length) break;
      let [a, b] = pairs[Math.floor(rand() * pairs.length)];
      if (rand() < 0.5) [a, b] = [b, a];
      v[a] *= 2; v[b] = 0;
      merges.push({ keep: a, gone: b });
      tiles--;
    }
    if (Math.max(...v) > MAX_TILE) continue; // reject
    if (!best || tiles < best.tiles) best = { v, merges, tiles };
    if (tiles <= target) break;
  }

  let colour = 0;
  const cells = best.v.map(x => (x ? { v: x, c: colour++ } : null));
  const solution = best.merges.slice().reverse()
    .map(m => ({ from: m.keep, dir: dirBetween(n, m.keep, m.gone) }));

  // States along the solution, so hints still work after a correct move made in any order.
  const path = [keyOf(cells)];
  let cur = cells;
  for (const s of solution) { cur = applySplit(cur, n, s.from, s.dir); path.push(keyOf(cur)); }

  return { n, cells, solution, path, tiles: best.tiles };
}

// ===================== MOVES =====================

function neighbour(n, i, dir) {
  const r = Math.floor(i / n) + DIRS[dir][0], c = (i % n) + DIRS[dir][1];
  return r < 0 || c < 0 || r >= n || c >= n ? -1 : r * n + c;
}

function dirBetween(n, a, b) {
  for (const d in DIRS) if (neighbour(n, a, d) === b) return d;
  return null;
}

// Destination index if tile i can split toward dir, else -1.
function splitTarget(cells, n, i, dir) {
  const t = cells[i];
  if (!t || t.v < 2) return -1;
  const j = neighbour(n, i, dir);
  return j >= 0 && !cells[j] ? j : -1;
}

function applySplit(cells, n, i, dir) {
  const j = splitTarget(cells, n, i, dir);
  if (j < 0) return null;
  const out = cloneCells(cells);
  out[i].v /= 2;
  out[j] = { v: out[i].v, c: out[i].c };
  return out;
}

// A colour region is done when every tile descended from that starting tile is a 1.
function regionDone(cells, c) {
  return cells.every(t => !t || t.c !== c || t.v === 1);
}

const isWin = cells => cells.every(t => t && t.v === 1);

function blockedTiles(cells, n) {
  const out = [];
  cells.forEach((t, i) => {
    if (t && t.v > 1 && Object.keys(DIRS).every(d => splitTarget(cells, n, i, d) < 0)) out.push(i);
  });
  return out;
}

function isStuck(cells, n) {
  if (cells.every(Boolean)) return false;
  return cells.every((t, i) => !t || t.v < 2 || Object.keys(DIRS).every(d => splitTarget(cells, n, i, d) < 0));
}

function nextHint() {
  const k = S.board.path.indexOf(keyOf(S.cells));
  return k >= 0 && k < S.board.solution.length ? S.board.solution[k] : null;
}

// Headless check: sums, max tile, and the recorded solution reaches all 1s.
function selfTest(perSize = 1000, rand = Math.random) {
  const results = {};
  for (const n of [4, 5, 6]) {
    const { min, max } = SIZES[n];
    let sum = 0, cap = 0, solved = 0, hitTarget = 0;
    for (let k = 0; k < perSize; k++) {
      const target = min + Math.floor(rand() * (max - min + 1));
      const b = generate(n, target, rand);
      const vals = b.cells.map(t => (t ? t.v : 0));
      if (vals.reduce((a, x) => a + x, 0) === n * n) sum++;
      if (Math.max(...vals) <= MAX_TILE) cap++;
      if (b.tiles === target) hitTarget++;
      let cur = b.cells, ok = true;
      for (const s of b.solution) { cur = applySplit(cur, n, s.from, s.dir); if (!cur) { ok = false; break; } }
      if (ok && isWin(cur)) solved++;
    }
    results[n] = { boards: perSize, sum, cap, solved, hitTarget };
  }
  return results;
}

if (typeof module !== 'undefined') {
  module.exports = { generate, applySplit, splitTarget, isWin, isStuck, blockedTiles, selfTest, SIZES, MAX_TILE };
}

// ===================== RENDER =====================

if (typeof document !== 'undefined') {
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), stageEl = $('stage');

  function tileVars(c, v) {
    const hue = (25 + ((c * 137.508) % 310)).toFixed(0); // golden-angle spread, skips pure red (reserved for "blocked")
    if (S.skin === 'kittens') return `--col:hsl(${hue} 70% 64%);--col2:hsl(${hue} 60% 42%);--cloud:hsl(${hue} 55% 76%)`;
    const light = S.skin === 'slimes'
      ? 58 - Math.log2(v) * 4                // slimes: babies pale, big ones deeper
      : 30 + Math.log2(v) * 5;               // numbers: bigger values a touch brighter

  // Kitten SVGs, viewBox 0 0 100 100, cartoon style: dark outline, tabby stripes, white muzzle.

  const TAIL = d => `<path class="tailo" d="${d}"/><path class="tail" d="${d}"/><path class="tails" d="${d}"/>`;
  const KITTEN = `<svg viewBox="0 0 100 100" aria-hidden="true">

    <path class="stripe" d="M62 46 q5 6 3 13 M73 48 q5 6 2 13 M83 55 q3 5 0 11"/>
    ${TAIL('M90 70 C 90 92, 52 96, 30 87')}
    <path class="fur ol" d="M17 47 L14 19 L38 33 Z M40 31 L60 18 L61 45 Z"/>
    <path class="ear" d="M20 41 L18 26 L31 34 Z M45 32 L56 25 L57 39 Z"/>
    <ellipse class="fur ol" cx="37" cy="52" rx="24" ry="20"/>
    <path class="stripe" d="M31 34 l1 6 M37 33 v6 M43 34 l-1 6"/>
    <ellipse class="white" cx="38" cy="61" rx="12" ry="8"/>
    <circle class="blush" cx="22" cy="58" r="4"/><circle class="blush" cx="53" cy="58" r="4"/>
    <path class="ink" d="M24 52 q5 -5 10 0 M41 52 q5 -5 10 0"/>

  </svg>`;
  const FIGHT_EARS = [[28, 10, -25], [56, 2, 12], [42, 4, -8], [74, 12, 30], [14, 26, -42]]; // x, tip y, tilt
  const FIGHT_EYES = [[40, 52], [62, 64], [32, 70], [64, 44]];

  function fightCloud(v) {

    const eyes = FIGHT_EYES.slice(0, k)

    const paws = FIGHT_PAWS.slice(0, Math.min(4, k + 1))

    const cloud = CLOUD.map(([x, y, r]) => `<circle class="cloudo" cx="${x}" cy="${y}" r="${r + 3}"/>`).join('') +

    return `<svg viewBox="0 0 100 100" aria-hidden="true">
      ${TAIL('M78 66 q20 -4 13 -28')}${k >= 3 ? TAIL('M22 70 q-18 2 -12 -24') : ''}

  function tileInner(t, i, popping) {
    if (S.skin === 'numbers') return String(t.v);
    if (S.skin === 'kittens') {
      const size = t.v === 1 ? 0.8 : 0.74 + Math.log2(t.v) * 0.06; // a 16-kitten brawl fills the cell
      const badge = t.v > 1 ? `<span class="badge">${t.v}</span>` : '';
      const z = t.v === 1 && (i * 7) % 4 === 0 ? '<span class="z">z<small>z</small></span>' : '';
      const puffs = popping ? [0, 60, 120, 180, 240, 300].map(a => `<i class="puff" style="--a:${a}deg"></i>`).join('') : '';
      return `<div class="blob kit" style="--s:${size}">${t.v > 1 ? fightCloud(t.v) : KITTEN}</div>${badge}${z}${puffs}`;
    }
    const size = 0.5 + Math.log2(t.v) * 0.12; // 1 → half a cell, 16 → nearly full
    const badge = t.v > 1 ? `<span class="badge">${t.v}</span>` : '';
    const z = t.v === 1 && (i * 7) % 5 === 0 ? '<span class="z">z</span>' : ''; // a few sleepers snore
    return `<div class="blob" style="--s:${size}"><i class="eye"></i><i class="eye"></i></div>${badge}${z}`;
  }

  function fmtTime(ms) {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function layout() {
    const r = stageEl.getBoundingClientRect();
    const side = Math.floor(Math.min(r.width, r.height));
    boardEl.style.width = boardEl.style.height = side + 'px';
    const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
    boardEl.style.setProperty('--cell', (side - gap * (S.n + 1)) / S.n + 'px');
  }

  function render() {
    const { n, cells, drag } = S;
    const stuck = !S.won && !S.lost && isStuck(cells, n);
    const blocked = new Set(stuck ? blockedTiles(cells, n) : []);
    const hint = S.showSol && !S.won ? nextHint() : null;
    const hintDst = hint ? neighbour(n, hint.from, hint.dir) : -1;
    const anim = S.effects || (S.anim && S.anim.boom != null) ? S.anim : null; // the explosion always shows
    const now = performance.now() / 1000;
    const phase = (offset, period) => -((now + offset) % period).toFixed(2) + 's';
    let wave = 0;
    S.anim = null;
    const done = new Set();
    if (S.effects) cells.forEach(t => { if (t && !done.has(t.c) && regionDone(cells, t.c)) done.add(t.c); });

    boardEl.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    boardEl.classList.toggle('fx', S.effects);
    boardEl.classList.toggle('live', !!S.t0 && !S.won && !S.lost);
    const nowMs = Date.now(), F = S.fuseMs / 1000;
    let html = '';
    for (let i = 0; i < n * n; i++) {
      let t = cells[i], cls = '', extra = '';
      const blinkPeriod = 3.2 + (i * 1.13) % 2.5;
      let style = `;--d:${phase(i * 0.37, 2.6)};--bp:${blinkPeriod.toFixed(2)}s;--bd:${phase(i * 0.71, blinkPeriod)}`;
      if (drag && drag.dest >= 0) {
        const src = cells[drag.i];
        if (i === drag.i) { t = { v: src.v / 2, c: src.c }; cls = ` active stretch-${drag.dir}`; }
        if (i === drag.dest) { t = { v: src.v / 2, c: src.c }; cls = ' ghost'; }
      }
      if (t && done.has(t.c) && !(drag && (i === drag.i || i === drag.dest))) cls += ' done';
      if (anim && t) {
        // The split pair always plays its own motion; the wave follows once the baby lands.
        if (i === anim.from) cls += ' pop';
        else if (i === anim.to) { cls += ' slide'; style += `;--sx:${-DIRS[anim.dir][1]};--sy:${-DIRS[anim.dir][0]}`; }
        else if (anim.win) { cls += ' cheer'; style += `;--wd:${250 + (Math.floor(i / n) + i % n) * 45}ms`; }
        else if (anim.region === t.c) { cls += ' flash'; style += `;--wd:${200 + wave++ * 50}ms`; }
      }
      if (blocked.has(i)) cls += ' blocked upset';
      let fuseBar = '';
      if (S.fuseMs && !S.lost && t && cells[i] && cells[i].v > 1 && !(drag && i === drag.dest)) {
        const left = S.fuse[i] ? Math.max(0, S.fuse[i] - nowMs) : S.fuseMs;
        if (S.t0 && left < 3000) cls += ' danger';
        fuseBar = `<i class="fuse" style="--ft:${F}s;--fd:${((left - S.fuseMs) / 1000).toFixed(2)}s"></i>`;
      }
      if (anim && anim.boom === i) {
        cls += ' boom';
        fuseBar = '<span class="pow">POW!</span>' + Array.from({ length: 10 }, (_, k) => `<i class="puff" style="--a:${k * 36}deg"></i>`).join('');
      }
      if (t && t.v === 1) cls += ' sleep';
      if (S.skin !== 'numbers') cls += ' slime';
      if (S.skin === 'kittens') {
        cls += ' kitten';
        if (t && t.v > 1) { cls += ' fight'; style += `;--sh:${(0.5 - Math.log2(t.v) * 0.07).toFixed(2)}s`; }
      }
      if (hint && i === hint.from) extra = `<span class="arrow">${ARROWS[hint.dir]}</span>`;
      const tile = t ? `<div class="tile${cls}" style="${tileVars(t.c, t.v)}${style}">${tileInner(t, i, cls.includes(' pop'))}${fuseBar}${extra}</div>`
        : S.skin === 'kittens' ? '<span class="bed"></span>' : '<span class="dot">1</span>';
      html += `<div class="cell${i === hintDst ? ' hint-dst' : ''}" data-i="${i}">${tile}</div>`;
    }
    boardEl.innerHTML = html;

    const status = $('status');
    status.className = '';
    if (stuck) { status.textContent = 'Stuck. Undo or restart.'; status.className = 'bad'; }
    else if (hint) { status.textContent = `Hint: split the ${cells[hint.from].v} ${hint.dir}`; status.className = 'hint'; }
    else if (S.showSol && !S.won) { status.textContent = 'Off the solution path. Undo to get hints back.'; status.className = 'hint'; }
    else status.textContent = { kittens: 'Give every kitten its own cell to sleep', slimes: 'Put a baby slime in every cell', numbers: 'Fill every cell with a 1' }[S.skin];

    $('undos').textContent = S.undos;
    $('left').textContent = cells.filter(t => !t).length;
    $('time').textContent = fmtTime(S.elapsed);
    $('undo').disabled = !S.history.length || S.won || S.lost;
    $('info').textContent = `${S.board.tiles} tiles · ${S.board.solution.length} splits`;
    document.querySelectorAll('#sizes button').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
  }

  // ---------- game flow ----------
  function stopTimer() { clearInterval(S.timer); S.timer = 0; }
  // Fuses only burn once the clock starts, so nothing explodes while you read the board.
  function armFuses() {
    const now = Date.now();
    S.fuse = S.cells.map((t, i) => (S.fuseMs && t && t.v > 1 ? S.fuse[i] || now + S.fuseMs : null));
  }

  let dangerKey = '';
  function tick() {
    const now = Date.now();
    S.elapsed = now - S.t0;
    $('time').textContent = fmtTime(S.elapsed);
    if (S.won || S.lost) return;
    let first = -1;
    S.fuse.forEach((d, i) => { if (d && d <= now && (first < 0 || d < S.fuse[first])) first = i; });
    if (first >= 0) return explode(first);
    const key = S.fuse.map(d => (d && d - now < 3000 ? 1 : 0)).join('');
    if (key !== dangerKey) { dangerKey = key; if (!S.drag) render(); }
  }

  function startTimer() {
    S.t0 = Date.now();
    armFuses();
    S.timer = setInterval(tick, 100);
  }

  function explode(i) {
    S.lost = true; S.drag = null; stopTimer();
    S.anim = { boom: i };
    boomSound();
    boardEl.classList.remove('shake'); void boardEl.offsetWidth; boardEl.classList.add('shake');
    render();
    const n = S.cells[i].v;
    $('winTitle').textContent = S.skin === 'kittens' ? 'Cat fight!' : 'Boom!';
    $('winTitle').className = 'lose';
    $('winMsg').textContent = S.skin === 'kittens' ? `${n} kittens fought too long and blew up.` : `A ${n} waited too long and exploded.`;
    $('winTime').textContent = fmtTime(S.elapsed);
    $('winUndos').textContent = S.undos;
    $('winRestart').textContent = 'Try again';
    setTimeout(() => { if (S.lost) $('overlay').hidden = false; }, 900);
  }

  function restart() {
    stopTimer();
    Object.assign(S, { cells: cloneCells(S.board.cells), history: [], undos: 0, t0: 0, elapsed: 0, won: false, lost: false, drag: null, fuse: [] });
    dangerKey = '';
    boardEl.classList.remove('shake');
    $('overlay').hidden = true;
    render();
  }

  function newBoard() {
    S.board = generate(S.n, S.target);
    layout();
    restart();
  }

  function setSize(n) {
    S.n = n;
    const { min, max, def } = SIZES[n];
    const slider = $('tiles');
    slider.min = min; slider.max = max; slider.value = def;
    S.target = def; $('tilesOut').textContent = def;
    newBoard();
  }

  // ---------- sound ----------
  // Created on the first touch, since browsers only allow audio after a gesture.
  let audio = null;
  function initAudio() {
    if (audio || !S.effects) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  }
  function tone(freq, at = 0, len = 0.12, vol = 0.18, type = 'triangle') {
    if (!audio || !S.effects) return;
    const t = audio.currentTime + at, osc = audio.createOscillator(), g = audio.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + len);
    osc.connect(g).connect(audio.destination);
    osc.start(t); osc.stop(t + len + 0.02);
  }
  // Pitch rises as tiles get smaller: splitting a 16 is low, splitting a 2 is high.
  const splitSound = v => (S.skin === 'kittens' ? mew : tone)(330 * Math.pow(2, (4 - Math.log2(v)) * 3 / 12));
  // A short rising-then-falling glide reads as a mew; a noise burst is the scuffle popping.
  function mew(base) {
    if (!audio || !S.effects) return;
    const t = audio.currentTime, osc = audio.createOscillator(), g = audio.createGain();
    const p = base * 2;
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(p * 0.8, t);
    osc.frequency.linearRampToValueAtTime(p * 1.3, t + 0.08);
    osc.frequency.exponentialRampToValueAtTime(p * 0.7, t + 0.3);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    osc.connect(g).connect(audio.destination);
    osc.start(t); osc.stop(t + 0.34);
    const len = 0.12, buf = audio.createBuffer(1, audio.sampleRate * len, audio.sampleRate), d = buf.getChannelData(0);
    for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / d.length);
    const src = audio.createBufferSource(), bp = audio.createBiquadFilter(), ng = audio.createGain();
    src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = 1800; ng.gain.value = 0.12;
    src.connect(bp).connect(ng).connect(audio.destination);
    src.start(t);
  }
  function boomSound() {
    if (!audio) return; // the loss still shows with sound off
    const t = audio.currentTime, len = 0.6;
    const buf = audio.createBuffer(1, audio.sampleRate * len, audio.sampleRate), d = buf.getChannelData(0);
    for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / d.length, 2);
    const src = audio.createBufferSource(), lp = audio.createBiquadFilter(), g = audio.createGain();
    src.buffer = buf; lp.type = 'lowpass'; lp.frequency.value = 900; g.gain.value = 0.5;
    src.connect(lp).connect(g).connect(audio.destination);
    src.start(t);
    tone(110, 0, 0.4, 0.25, 'sawtooth');
  }
  const regionSound = () => [523, 659, 784].forEach((f, k) => tone(f, 0.06 + k * 0.07, 0.3, 0.14));
  const winSound = () => [523, 659, 784, 1047].forEach((f, k) => tone(f, 0.1 + k * 0.09, 0.5, 0.16));

  function move(i, dir) {
    const v = S.cells[i] && S.cells[i].v;
    const next = applySplit(S.cells, S.n, i, dir);
    if (!next) return;
    if (!S.t0) startTimer();
    const now = Date.now(), j = neighbour(S.n, i, dir);
    S.history.push({ cells: S.cells, fuseLeft: S.fuse.map(d => (d ? d - now : null)) });
    S.cells = next;
    // Splitting calms both halves: each remaining fight gets a fresh fuse.
    S.fuse = S.fuse.slice();
    S.fuse[i] = S.fuseMs && next[i].v > 1 ? now + S.fuseMs : null;
    S.fuse[j] = S.fuseMs && next[j].v > 1 ? now + S.fuseMs : null;
    const c = next[i].c;
    const region = regionDone(next, c) ? c : null;
    S.anim = { from: i, to: neighbour(S.n, i, dir), dir, region, win: isWin(next) };
    splitSound(v);
    if (region !== null) regionSound();
    if (isWin(next)) {
      S.won = true; S.elapsed = Date.now() - S.t0; stopTimer();
      $('winTime').textContent = fmtTime(S.elapsed);
      $('winUndos').textContent = S.undos;
      $('winTitle').textContent = S.skin === 'kittens' ? 'All asleep' : 'Solved';
      $('winTitle').className = '';
      $('winMsg').textContent = S.skin === 'kittens' ? 'Every kitten has its own bed.' : 'Every cell holds a 1.';
      $('winRestart').textContent = 'Replay';
      winSound();
      setTimeout(() => { if (S.won) $('overlay').hidden = false; }, S.effects ? 1100 : 0);
    }
    render();
  }

  // Undo restores the fuse time each fight had left, so it can't be used to refill fuses.
  function undo() {
    if (!S.history.length || S.won || S.lost) return;
    const prev = S.history.pop(), now = Date.now();
    S.cells = prev.cells;
    S.fuse = prev.fuseLeft.map(r => (r == null ? null : now + r));
    armFuses(); // fights that had no fuse yet (before the first move) get a full one
    S.undos++;
    render();
  }

  // ===================== INPUT =====================
  boardEl.addEventListener('pointerdown', e => {
    if (S.won || S.lost || S.drag) return;
    initAudio();
    const cell = e.target.closest('.cell');
    if (!cell) return;
    const i = +cell.dataset.i;
    if (!S.cells[i]) return;
    e.preventDefault();
    boardEl.setPointerCapture(e.pointerId);
    S.drag = { id: e.pointerId, i, x: e.clientX, y: e.clientY, dir: null, dest: -1 };
  });

  boardEl.addEventListener('pointermove', e => {
    const d = S.drag;
    if (!d || d.id !== e.pointerId) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    let dir = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) >= THRESHOLD) {
      dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    }
    const dest = dir ? splitTarget(S.cells, S.n, d.i, dir) : -1;
    if (dir !== d.dir || dest !== d.dest) { d.dir = dir; d.dest = dest; render(); }
  });

  function endDrag(e, commit) {
    const d = S.drag;
    if (!d || d.id !== e.pointerId) return;
    S.drag = null;
    if (commit && d.dest >= 0) move(d.i, d.dir); else render();
  }
  boardEl.addEventListener('pointerup', e => endDrag(e, true));
  boardEl.addEventListener('pointercancel', e => endDrag(e, false));

  $('sizes').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSize(+b.dataset.n); });
  $('tiles').addEventListener('input', e => { $('tilesOut').textContent = e.target.value; });
  $('tiles').addEventListener('change', e => { S.target = +e.target.value; newBoard(); });
  $('undo').addEventListener('click', undo);
  $('restart').addEventListener('click', restart);
  $('new').addEventListener('click', newBoard);
  $('winRestart').addEventListener('click', restart);
  $('winNew').addEventListener('click', newBoard);
  $('showSol').addEventListener('change', e => { S.showSol = e.target.checked; render(); });
  $('effects').addEventListener('change', e => {
    S.effects = e.target.checked;
    try { localStorage.setItem('split.effects', S.effects ? '1' : '0'); } catch (err) {}
    render();
  });
  $('fuse').addEventListener('change', e => {
    S.fuseMs = +e.target.value * 1000;
    try { localStorage.setItem('split.fuse', e.target.value); } catch (err) {}
    restart();
  });
  try {
    const f = localStorage.getItem('split.fuse');
    if (['0', '8', '12', '20'].includes(f)) { S.fuseMs = +f * 1000; $('fuse').value = f; }
  } catch (err) {}
  $('skin').addEventListener('change', e => {
    S.skin = e.target.value;
    try { localStorage.setItem('split.skin', S.skin); } catch (err) {}
    render();
  });
  try { if (localStorage.getItem('split.effects') === '0') { S.effects = false; $('effects').checked = false; } } catch (err) {}
  try {
    const skin = localStorage.getItem('split.skin');
    if (['kittens', 'slimes', 'numbers'].includes(skin)) { S.skin = skin; $('skin').value = skin; }
  } catch (err) {}
  document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'z') undo(); });
  window.addEventListener('resize', layout);

  setSize(4);

  // Open with ?test to run the generator check in the page.
  if (/[?&]test\b/.test(location.search)) {
    const r = selfTest(1000);
    const line = Object.entries(r).map(([n, x]) => `${n}x${n}: ${x.solved}/${x.boards}`).join(' · ');
    $('status').textContent = 'Self-test ' + line;
    console.table(r);
  }
}
</script>
</body>
</html>
