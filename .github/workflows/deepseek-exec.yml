# DeepSeek executor: runs one Haiku-tier plan task with Claude Code on DeepSeek Flash, then opens a PR.
# Job 1 holds the DeepSeek key and no write token. Job 2 holds a write token and no model.
name: DeepSeek executor

on:
  workflow_dispatch:
    inputs:
      plan:
        description: Plan slug (docs/plans/<slug>.md on main)
        required: true
      task:
        description: Task id, e.g. T9 (must be tagged Haiku in the plan)
        required: true

permissions:
  contents: read

concurrency:
  group: executor-${{ inputs.plan }}-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: sha
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Refuse before any model call. Trusted copies of the scripts live outside the workspace so the model cannot edit them.
      - name: Pre-flight
        env:
          PLAN: ${{ inputs.plan }}
          TASK: ${{ inputs.task }}
          OUT: ${{ runner.temp }}/pf
        run: |
          mkdir -p "$RUNNER_TEMP/exec-scripts"
          cp scripts/executor/*.mjs scripts/executor/prompt.md "$RUNNER_TEMP/exec-scripts/"
          node "$RUNNER_TEMP/exec-scripts/preflight.mjs"
      # No lockfile and no deps in this repo: tests need only Playwright, installed the same way as ci.yml.
      - run: npm i --no-save --no-package-lock playwright@1.63.0
      - run: npm install -g @anthropic-ai/claude-code@2.1.309
      - name: Run executor
        env:
          PLAN: ${{ inputs.plan }}
          TASK: ${{ inputs.task }}
          CI: 'true'
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: deepseek-flash[1m]
          ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-flash[1m]
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-flash[1m]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-flash
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-flash
          CLAUDE_CODE_EFFORT_LEVEL: high
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: '786432'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_AUTOUPDATER: '1'
        run: |
          set -u
          [ -n "${ANTHROPIC_AUTH_TOKEN}" ] || { echo "DEEPSEEK_API_KEY secret is not set"; exit 1; }
          unset ANTHROPIC_API_KEY || true
          echo "::add-mask::${ANTHROPIC_AUTH_TOKEN}"
          mkdir -p .executor
          printf '.executor/\n' >> .git/info/exclude
          { sed "s/{PLAN}/$PLAN/g; s/{TASK}/$TASK/g" "$RUNNER_TEMP/exec-scripts/prompt.md"; cat "$RUNNER_TEMP/pf/task.md"; } > "$RUNNER_TEMP/prompt.txt"
          cat > "$RUNNER_TEMP/settings.json" <<'JSON'
          {"permissions":{"deny":[
            "Read(//proc/**)","Read(//sys/**)","Read(//etc/**)","Read(//root/**)","Read(//home/**)","Read(//tmp/**)",
            "Read(//run/**)","Read(//github/**)","Read(//__w/_temp/**)","Read(//__w/_actions/**)","Read(~/**)",
            "Edit(.github/**)","Write(.github/**)"
          ]}}
          JSON
          # Raw CLI output is never printed: it can echo env or file contents. It is scanned for the key, then reduced to usage numbers.
          set +e
          timeout 22m claude -p --max-turns 40 --permission-mode acceptEdits --output-format json \
            --settings "$RUNNER_TEMP/settings.json" \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(node test/selftest.cjs),Bash(node test/e2e.cjs),Bash(git diff:*),Bash(git status)" \
            --disallowedTools "WebSearch,WebFetch,Task,NotebookEdit" \
            < "$RUNNER_TEMP/prompt.txt" > "$RUNNER_TEMP/claude-out.json" 2> "$RUNNER_TEMP/claude-err.txt"
          echo "claude exit: $?"
          exit 0
      - name: Leak scan, patch and usage
        if: always()
        env:
          KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/art"
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/art/patch.diff"
          cp .executor/report.json "$RUNNER_TEMP/art/report.json" 2>/dev/null || true
          node -e '
            const fs=require("fs");let u={};
            try{const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/claude-out.json","utf8"));const x=j.usage||{};
              u={input:x.input_tokens||0,cacheRead:x.cache_read_input_tokens||0,cacheWrite:x.cache_creation_input_tokens||0,output:x.output_tokens||0,turns:j.num_turns||0,isError:!!j.is_error};}catch{}
            fs.writeFileSync(process.env.RUNNER_TEMP+"/art/usage.json",JSON.stringify(u));'
          # Scan the model's raw output, its patch and its report. Any match deletes the artifacts and fails the job.
          if ! node "$RUNNER_TEMP/exec-scripts/keyscan.mjs" "$RUNNER_TEMP/art" "$RUNNER_TEMP/claude-out.json" "$RUNNER_TEMP/claude-err.txt"; then
            rm -rf "$RUNNER_TEMP/art"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: executor-${{ inputs.plan }}-${{ inputs.task }}
          path: ${{ runner.temp }}/art
          retention-days: 7

  publish:
    needs: execute
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.execute.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: executor-${{ inputs.plan }}-${{ inputs.task }}
          path: ${{ runner.temp }}/art
      - name: Pre-flight (again, on the same commit)
        env:
          PLAN: ${{ inputs.plan }}
          TASK: ${{ inputs.task }}
          OUT: ${{ runner.temp }}/pf
        run: node scripts/executor/preflight.mjs
      - name: Gate
        env:
          PLAN: ${{ inputs.plan }}
          TASK: ${{ inputs.task }}
          PF: ${{ runner.temp }}/pf
          ART: ${{ runner.temp }}/art
          OUT: ${{ runner.temp }}/out
          KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/executor/gate.mjs
          echo "VERDICT=$(node -p "require('$RUNNER_TEMP/out/verdict.json').verdict")" >> "$GITHUB_ENV"
          echo "STATUS=$(node -p "require('$RUNNER_TEMP/out/verdict.json').status||''")" >> "$GITHUB_ENV"
      - name: Gate rejected
        if: env.VERDICT == 'reject'
        run: |
          echo "Gate rejected the run. No PR opened. See the job summary."
          exit 1
      - name: Open PR
        if: env.VERDICT == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ inputs.plan }}
          TASK: ${{ inputs.task }}
          OUT: ${{ runner.temp }}/out
        run: |
          branch="executor/$PLAN-$TASK-$GITHUB_RUN_ID"
          git checkout -q -b "$branch"
          git commit -q -m "Executor: $PLAN $TASK" -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push -q origin "$branch"
          draft=""; label=""
          if [ "$STATUS" != done ]; then draft="--draft"; label="executor:$([ "$STATUS" = stopped ] && echo question || echo failed)"; fi
          url=$(gh pr create --base main --head "$branch" --title "Executor: $PLAN $TASK" --body-file "$OUT/pr-body.md" $draft)
          if [ -n "$label" ]; then
            gh label create "$label" --force >/dev/null
            gh pr edit "$url" --add-label "$label"
            gh pr comment "$url" --body-file "$OUT/question.md"
          fi
          echo "PR: $url" >> "$GITHUB_STEP_SUMMARY"
          # A push made with the default token does not start CI. Start it as a workflow_dispatch run.
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$branch\"}"
      - name: Open question issue
        if: env.VERDICT == 'issue'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ inputs.plan }}
          TASK: ${{ inputs.task }}
          OUT: ${{ runner.temp }}/out
        run: |
          gh label create "executor:$([ "$STATUS" = stopped ] && echo question || echo failed)" --force >/dev/null
          gh issue create --title "Executor question: $PLAN $TASK" \
            --label "executor:$([ "$STATUS" = stopped ] && echo question || echo failed)" --body-file "$OUT/question.md"
